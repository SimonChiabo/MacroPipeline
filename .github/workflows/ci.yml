name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint + Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `scripts/` entra en los tres gates: quedaba fuera, y el chequeo de
      # deriva de `.env` que vive ahi ya tiene tests. Codigo sin gate es
      # codigo que solo se revisa cuando alguien se acuerda.
      - name: Ruff lint
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

      - name: Mypy type check
        run: mypy src/ scripts/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Unit e integration mockean todas las dependencias externas: ninguno
      # necesita credenciales reales (verificado corriendolos con el entorno
      # limpio). `tests/integration/` quedaba fuera del gate, asi que sus
      # tests —los unicos que ejercitan el orquestador de punta a punta— no
      # corrian en CI: el que atrapa que una run sin publicadores no puede
      # marcarse como publicada vive ahi.
      - name: Run unit and integration tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ -v \
            --cov=src/macro_pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      # Este paso fallaba en *todas* las runs con `Token required - not valid
      # tokenless upload` y el job salia verde igual: la cobertura no se subia
      # desde hacia meses y nadie lo veia. Dos cambios: el token entra como
      # input (`env: CODECOV_TOKEN` llegaba vacio porque el secret no existia)
      # y `fail_ci_if_error` pasa a `true`. Poner `false` ahi es exactamente lo
      # que dejo el gate mintiendo en verde; si Codecov se cae, relanzar.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  nightly-vivo:
    name: El nightly no puede quedar apagado
    runs-on: ubuntu-latest
    # Solo en push: en un PR desde un fork el token es de solo lectura y el
    # paso fallaria por permisos, no por el estado del workflow.
    if: github.event_name == 'push'
    permissions:
      actions: write

    steps:
      # GitHub apaga los workflows programados de un repo publico tras 60 dias
      # sin actividad, y re-habilitarlos es manual: ninguna actividad posterior
      # los reactiva. Sin esto se vuelve al repo, se commitea, y la alarma del
      # token de LinkedIn sigue apagada sin que nadie se entere — y los 60 dias
      # de inactividad son justo la ventana del token.
      - name: Reactivar contract-tests.yml si GitHub lo apago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El job no hace checkout, asi que el working dir no es un repo git y
          # `gh workflow enable` no tiene de donde deducir el repositorio. Sin
          # esto fallaria con "not a git repository" — y solo en la rama de
          # `disabled_inactivity`, que es la unica que importa y la que casi
          # nunca se ejercita.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ruta="repos/${{ github.repository }}/actions/workflows/contract-tests.yml"
          estado=$(gh api "${ruta}" --jq .state)
          echo "Estado de contract-tests.yml: ${estado}"

          if [ "${estado}" != "disabled_inactivity" ]; then
            exit 0
          fi

          gh workflow enable contract-tests.yml
          echo "::warning title=Nightly reactivado::GitHub habia apagado contract-tests.yml por inactividad. Se reactivo, pero estuvo ciego un tiempo indeterminado."
          {
            echo "## ⚠️ El nightly estaba apagado"
            echo
            echo "GitHub deshabilita los workflows programados tras 60 dias sin"
            echo "actividad en el repo. \`contract-tests.yml\` estaba en"
            echo "\`disabled_inactivity\` y se reactivo automaticamente."
            echo
            echo "**Mientras estuvo apagado no corrio ninguna verificacion de"
            echo "contratos ni del token de LinkedIn.** Conviene correr"
            echo "\`python scripts/check_publishers.py\` a mano."
          } >> "${GITHUB_STEP_SUMMARY}"
