name: Contract Tests (Nightly)

on:
  schedule:
    # Lunes a viernes a las 07:00 UTC (antes de apertura de mercados europeos)
    - cron: "0 7 * * 1-5"
  workflow_dispatch: # Permite lanzar manualmente desde GitHub UI

jobs:
  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # El aviso de vencimiento del token de LinkedIn. Va primero a proposito:
      # el paso de secrets de abajo sale con 1 si falta una key de FRED o AV, y
      # esta alarma no puede depender de eso. Usa `python3` del runner y no
      # `setup-python` ni el paquete instalado —el script es stdlib puro— para
      # que tampoco dependa de que el `pip install` funcione.
      - name: Avisar si el token de LinkedIn esta por vencer
        id: aviso_linkedin
        env:
          PUBLISH_LINKEDIN: ${{ vars.PUBLISH_LINKEDIN }}
          LINKEDIN_TOKEN_ISSUED: ${{ vars.LINKEDIN_TOKEN_ISSUED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # `set -e` es lo que hace que un crash del script salga en rojo en
          # vez de dar mensaje vacio y pasar por silencio.
          set -euo pipefail

          mensaje=$(python3 scripts/linkedin_token_alert.py)

          if [ -z "${mensaje}" ]; then
            echo "Token de LinkedIn: hoy no toca avisar."
            exit 0
          fi

          echo "${mensaje}"
          echo "> ⚠️ ${mensaje}" >> "${GITHUB_STEP_SUMMARY}"

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning title=Aviso no enviado::Sin credenciales de Telegram; el aviso del token queda solo en el resumen del run."
            exit 0
          fi

          # `curl -s` a secas devuelve 0 aunque la API conteste 404, asi que
          # una alerta que nunca llego se ve igual que una entregada.
          #
          # El `|| status="000"` es lo que salva al mensaje de abajo. Si curl
          # falla a nivel de transporte —DNS, conexion, TLS— sale con 6/7/28 y
          # `set -e` mataria el script justo aca, sin llegar a la anotacion que
          # explica que el aviso no se entrego. El paso queda rojo igual, pero
          # diciendo por que.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${mensaje}") || status="000"

          if [ "${status}" != "200" ]; then
            echo "::error title=Aviso de LinkedIn no entregado::sendMessage devolvio HTTP ${status}."
            echo "> ❌ El aviso del token de LinkedIn no se entrego (HTTP ${status})." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "Aviso del token de LinkedIn entregado."

      # El repo no tenia ningun secret configurado, y el modo de fallo era
      # ilegible: pytest moria por credencial faltante y la alerta de Telegram
      # devolvia 404 sin que nadie se enterara. Este paso corre primero, nombra
      # de una todo lo que falta y explica como cargarlo.
      - name: Comprobar secrets requeridos
        id: secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # Las cuatro APIs que hoy tienen contract tests. `conftest.py` igual
          # falla ruidosamente en CI si falta una credencial que un test pide,
          # pero este paso corre antes de instalar nada y las nombra todas de
          # una en vez de morir en la primera.
          missing=""
          [ -n "${FRED_API_KEY}" ] || missing="${missing} FRED_API_KEY"
          [ -n "${ANTHROPIC_API_KEY}" ] || missing="${missing} ANTHROPIC_API_KEY"
          [ -n "${FMP_API_KEY}" ] || missing="${missing} FMP_API_KEY"
          [ -n "${ALPHA_VANTAGE_API_KEY}" ] || missing="${missing} ALPHA_VANTAGE_API_KEY"

          if [ -n "${missing}" ]; then
            {
              echo "## ❌ Faltan secrets obligatorios"
              echo
              echo "Los contract tests no pueden correr sin:"
              for name in ${missing}; do echo "- \`${name}\`"; done
              echo
              echo "Cargarlos con:"
              echo '```sh'
              for name in ${missing}; do
                echo "gh secret set ${name} -R ${{ github.repository }}"
              done
              echo '```'
              echo
              echo "Ver \`docs/adr/008-contract-tests.md\`."
            } >> "${GITHUB_STEP_SUMMARY}"

            for name in ${missing}; do
              echo "::error title=Secret faltante::${name} no esta configurado en el repositorio."
            done
            exit 1
          fi

          # Telegram solo transporta la alerta. Que falte degrada el aviso,
          # no invalida la verificacion: avisar y seguir.
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning title=Alertas de Telegram desactivadas::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no estan configurados. Si los contract tests fallan, el aviso solo va a quedar en el resumen del run."
            echo "> ⚠️ Alertas de Telegram desactivadas: falta \`TELEGRAM_BOT_TOKEN\` o \`TELEGRAM_CHAT_ID\`." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up Python 3.12
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        id: install
        run: pip install -e ".[dev]"

      # Los contract tests requieren API keys reales.
      # `-m contract` es obligatorio: pyproject define `addopts = -m 'not
      # contract'` para que el pytest local no pegue contra la red, y sin
      # sobrescribirlo aqui el job deseleccionaria todo y saldria en verde
      # sin haber verificado ningun contrato.
      - name: Run contract tests
        id: pytest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          # `pipefail` o el `tee` se traga el codigo de salida de pytest y el
          # job sale en verde con los tests fallando.
          set -o pipefail
          pytest tests/contract/ -v --timeout=30 -m contract | tee pytest-output.txt

      # El chequeo real de la credencial de LinkedIn, no solo su fecha. Corre
      # en todas las corridas y no solo tras una reconexion: una vez que los
      # secrets estan en CI, hacerlo siempre no necesita detectar el hueco y
      # ademas caza un token *revocado* dentro del dia. `PUBLISH_X=false` hace
      # que el script se saltee X entero, asi que no hacen falta sus cuatro
      # credenciales; `USE_FRED`, `USE_AV`, `USE_ANTHROPIC` y `USE_R2` en
      # "false" hacen lo mismo por los otros cuatro componentes de la tabla,
      # que este job tampoco tiene credenciales para chequear. La guarda corre
      # igual con un contract test en rojo, pero no si el entorno nunca se
      # construyo: sin `pip install` el script muere con ModuleNotFoundError,
      # cae en la rama generica y manda una alerta culpando a LinkedIn de que
      # falta una key de FRED. Una alerta que senala al componente equivocado
      # es peor que ninguna.
      - name: Verificar la credencial de LinkedIn
        id: credencial_linkedin
        if: (success() || failure()) && steps.install.outcome == 'success'
        env:
          PUBLISH_X: "false"
          # Mismo movimiento que el `PUBLISH_X` de arriba y por el mismo
          # motivo: este paso verifica LinkedIn y su alerta habla de LinkedIn.
          # Desde que el script chequea los siete componentes, dejarlos
          # encendidos aca lo pondria rojo por credenciales que este job no
          # tiene, y la alerta culparia a LinkedIn de que falta la key de FRED.
          USE_FRED: "false"
          USE_AV: "false"
          USE_ANTHROPIC: "false"
          USE_R2: "false"
          # Telegram se apaga por un motivo distinto al de los otros cuatro:
          # este paso SI tiene TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID, porque
          # los usa para mandar su propia alerta. Sin esta linea el chequeo
          # correria de verdad, todas las noches, contra el bot y el chat
          # privado del operador: el color de un paso que habla de LinkedIn
          # pasaria a depender de una credencial de Telegram, y el dia que ese
          # token muera la alerta culparia a LinkedIn — sin poder entregarse,
          # porque viaja por ese mismo token.
          USE_TELEGRAM: "false"
          PUBLISH_LINKEDIN: ${{ vars.PUBLISH_LINKEDIN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_ISSUED: ${{ vars.LINKEDIN_TOKEN_ISSUED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail

          if python scripts/check_credentials.py | tee linkedin-check.txt; then
            echo "Credencial de LinkedIn verificada."
            exit 0
          fi

          # Un corte de red y un token muerto ponen los dos el chequeo en rojo,
          # pero solo uno pide ir al portal. Mismo criterio que AV_RATE_LIMIT.
          if grep -q "LINKEDIN_UNREACHABLE" linkedin-check.txt 2>/dev/null; then
            texto="⚠️ No se pudo contactar la API de LinkedIn, asi que la credencial quedo sin verificar. NO es necesariamente el token: basta con relanzar."
          elif grep -q "LINKEDIN_TOKEN_DEAD" linkedin-check.txt 2>/dev/null; then
            texto="🔴 El token de LinkedIn no sirve (401): esta vencido o revocado. Reemitirlo desde el token generator del portal y actualizar LINKEDIN_TOKEN_ISSUED en el .env y en las variables del repo."
          else
            texto="⚠️ La verificacion de la credencial de LinkedIn fallo por otro motivo. Revisar el run."
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          texto="${texto} ${run_url}"

          echo "> ⚠️ ${texto}" >> "${GITHUB_STEP_SUMMARY}"

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning title=Alerta no enviada::Sin credenciales de Telegram; el aviso queda solo en el resumen del run."
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${texto}")

          if [ "${status}" != "200" ]; then
            echo "::error title=Alerta de LinkedIn no entregada::sendMessage devolvio HTTP ${status}."
            echo "> ❌ La alerta no se entrego (HTTP ${status})." >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit 1

      # Estos dos handlers son para lo que NO avisa por su cuenta. Los dos
      # pasos de LinkedIn mandan su propio Telegram, asi que entrarian dos
      # mensajes por un solo problema —y uno diciendo que fallaron los
      # contract tests con pytest en verde—. Se enumera lo que si cubren en
      # vez de excluir lo que no: excluyendo, un fallo real de contratos la
      # misma noche que un token muerto se perdia entero. Si se agrega un paso
      # que no avise por su cuenta, hay que sumarlo a esta lista.
      #
      # El resumen del run es el canal que no puede fallar: no depende de
      # ninguna credencial y queda en la pagina del workflow.
      - name: Registrar el fallo en el resumen del run
        if: >-
          failure()
          && (steps.secrets.outcome == 'failure'
              || steps.setup_python.outcome == 'failure'
              || steps.install.outcome == 'failure'
              || steps.pytest.outcome == 'failure')
        run: |
          {
            echo "## ❌ El nightly de contract tests fallo"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ "${{ steps.pytest.outcome }}" == "failure" ]; then
              echo "Revisar si alguna API cambio su schema, sus unidades o su endpoint."
            else
              echo "Fallo antes de llegar a correr los contract tests (secrets, setup o install). No es un cambio de API."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # Notificar por Telegram si los contract tests fallan.
      # `curl -s` a secas devuelve 0 aunque la API conteste 404, asi que una
      # alerta que nunca llego se veia igual que una entregada: hay que mirar
      # el status code y gritar si no es 200.
      - name: Notify on failure
        if: >-
          failure()
          && (steps.secrets.outcome == 'failure'
              || steps.setup_python.outcome == 'failure'
              || steps.install.outcome == 'failure'
              || steps.pytest.outcome == 'failure')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning title=Alerta no enviada::Sin credenciales de Telegram; el fallo queda solo en el resumen del run."
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Un fallo antes de pytest —secrets faltantes, setup, install— no es
          # un cambio de API, y decir que "los contract tests fallaron" manda a
          # revisar el sitio equivocado. Los dos pasos de LinkedIn no entran
          # aca: avisan por su cuenta y estan excluidos en el `if:` del paso.
          if [ "${{ steps.pytest.outcome }}" != "failure" ]; then
            texto="⚠️ El nightly fallo antes de correr los contract tests (secrets, setup o install). NO es un cambio de API. Workflow: ${run_url}"
          elif grep -q "AV_RATE_LIMIT" pytest-output.txt 2>/dev/null; then
            texto="⚠️ Contract tests en rojo: Alpha Vantage respondió rate limit, así que su contrato quedó sin verificar. NO es un cambio de API: basta con relanzar. ${run_url}"
          else
            texto="⚠️ Contract Tests fallaron. Revisar cambios de API. Workflow: ${run_url}"
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${texto}")

          if [ "${status}" != "200" ]; then
            echo "::error title=Alerta de Telegram no entregada::sendMessage devolvio HTTP ${status}. Revisar TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID."
            echo "> ❌ La alerta de Telegram no se entrego (HTTP ${status})." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "Alerta de Telegram entregada."
