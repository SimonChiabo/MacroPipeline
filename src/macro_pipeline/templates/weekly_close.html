<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre Semanal</title>
    <style>
        :root {{
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --accent: #38bdf8;
            --success: #4ade80;
            --danger: #f87171;
        }}
        body {{
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1080px;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }}
        .container {{
            width: 900px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 60px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }}
        .header {{
            text-align: center;
            margin-bottom: 50px;
        }}
        .header h1 {{
            font-size: 56px;
            margin: 0;
            color: var(--accent);
        }}
        .header p {{
            font-size: 28px;
            margin: 10px 0 0 0;
            opacity: 0.8;
        }}
        .metrics-grid {{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }}
        .metric-card {{
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }}
        .metric-title {{
            font-size: 32px;
            color: var(--text-light);
            opacity: 0.9;
        }}
        .metric-value {{
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
        }}
        .metric-return {{
            font-size: 36px;
            font-weight: bold;
        }}
        .metric-note {{
            font-size: 20px;
            opacity: 0.5;
            margin-top: 4px;
        }}
        .positive {{ color: var(--success); }}
        .negative {{ color: var(--danger); }}
        
        .macro-strip {{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }}
        .macro-item {{
            text-align: center;
        }}
        .macro-label {{
            display: block;
            font-size: 22px;
            opacity: 0.7;
        }}
        .macro-value {{
            display: block;
            font-size: 40px;
            font-weight: bold;
            margin: 8px 0 4px 0;
            color: var(--accent);
        }}
        .macro-asof {{
            display: block;
            font-size: 18px;
            opacity: 0.45;
        }}

        .footer {{
            margin-top: 60px;
            text-align: center;
            font-size: 24px;
            opacity: 0.5;
        }}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cierre Semanal de Mercado</h1>
            <p>{date}</p>
        </div>
        
        {metrics_grid}

        {macro_block}

        <div class="footer">
            MacroPipeline | Generado Automáticamente
        </div>
    </div>
</body>
</html>
