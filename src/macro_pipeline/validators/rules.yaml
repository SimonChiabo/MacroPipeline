weekly_close:
  # Los retornos semanales suelen oscilar en rangos específicos.
  # Un retorno mayor al 25% o menor al -25% en una semana es extremadamente
  # anómalo (circuit breakers, crisis financiera) o un error de datos.
  sp500_return_min: -0.25
  sp500_return_max: 0.25
  nasdaq_return_min: -0.30
  nasdaq_return_max: 0.30

  # Niveles de cierre. El pipeline pide a FMP `^GSPC`/`^IXIC` (indices) y cae a
  # Alpha Vantage con `SPY`/`QQQ` (ETFs, ~10x mas chicos). Desde 2026-08-31 la
  # ruta de AV no publica el nivel —lo deja en `None`, ADR-009 divergencia 4—,
  # asi que la primera defensa contra publicar 765,72 como cierre del S&P 500 es
  # que ese numero no se puebla. Estos rangos son la segunda: atrapan un nivel
  # de otro instrumento que llegue *poblado* por cualquier otro camino.
  # Anchos a proposito: detectan un cambio de instrumento o de unidad, no la
  # fluctuacion normal del mercado.
  sp500_close_min: 2000
  sp500_close_max: 30000
  nasdaq_close_min: 5000
  nasdaq_close_max: 100000

macro_snapshot:
  # Rangos de cordura para el bloque macro que acompaña al cierre semanal.
  cpi_yoy_min: -0.05         # Deflación peor al -5% interanual: error de datos
  cpi_yoy_max: 0.20          # Inflación > 20% interanual en EEUU: error de datos
  unrate_min: 0.0
  unrate_max: 25.0
  dgs10_min: 0.0
  dgs10_max: 20.0

  # Frescura máxima por serie, en días. Calibrado contra el calendario real de
  # publicación: el IPC de un mes sale a mediados del siguiente, así que la
  # última observación disponible ronda los 70 días de antigüedad justo antes
  # del próximo dato. Umbrales más ajustados descartarían datos válidos.
  cpi_max_staleness_days: 90
  unrate_max_staleness_days: 75
  dgs10_max_staleness_days: 10   # Serie diaria: tolera feriados y fines de semana largos

macro_release:
  # Controles de cordura (sanity checks) para métricas macroeconómicas
  gdp_growth_max_abs: 0.15   # +/- 15% cambio en GDP es el umbral de alerta
  unrate_max: 25.0           # Tasa de desempleo > 25% (nivel Gran Depresión)
  unrate_min: 0.0            # No puede ser negativa
