[project]
name = "macro-pipeline"
version = "0.1.0"
description = "Automated macroeconomic data pipeline"
authors = [
    { name = "Simon Chiabo", email = "simonchiabo@gmail.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    # Acotada bajo 2.0: la migracion 0.x -> 1.x ya esta hecha (el modelo pasa
    # a `claude-haiku-4-5` y `temperature` viaja por `extra_body`, porque 1.x
    # lo saco de la firma de `messages.create()`). El techo se queda para que
    # un 2.x futuro no entre solo y vuelva a hacer que CI difiera del local,
    # que es lo que paso cuando el rango estaba abierto.
    "anthropic>=1,<2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "requests-oauthlib>=1.3.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "pillow>=10.2.0",
    "playwright>=1.41.0",
    "pyyaml>=6.0.1",
    "boto3>=1.34.0",
    "boto3-stubs[essential]>=1.34.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    # Pineadas exactas a proposito: `ruff format --check` y `mypy --strict`
    # son gates de CI, y ambas herramientas cambian de opinion entre minors
    # (estilo del formateador, reglas nuevas por defecto, inferencia mas
    # estricta). Con un rango, "verde en local" no predice "verde en CI".
    # Subirlas es un cambio deliberado, no un efecto del dia en que corre.
    # Lo mismo vale para pytest, arriba: es el tercer gate del workflow.
    "ruff==0.15.12",
    "mypy==2.1.0",
    "pre-commit>=3.6.0",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Los contract tests pegan contra APIs reales: quedan fuera del run por
# defecto para que `pytest` local siga siendo rapido y sin red. El workflow
# nightly los selecciona explicitamente con `-m contract`.
addopts = "-m 'not contract'"
markers = [
    "contract: test contra una API externa real (requiere credenciales)",
]
