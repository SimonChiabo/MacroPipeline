[project]
name = "macro-pipeline"
version = "0.1.0"
description = "Automated macroeconomic data pipeline"
authors = [
    { name = "Simon Chiabo", email = "simon.chiabo@example.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "pillow>=10.2.0",
    "playwright>=1.41.0",
    "pyyaml>=6.0.1",
    "boto3>=1.34.0",
    "boto3-stubs[essential]>=1.34.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
